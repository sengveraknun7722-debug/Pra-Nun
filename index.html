<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For CHHING CHHING ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff758c,#ff7eb3,#c471ed);
}
.card{
  position:relative;z-index:2;width:min(92%,520px);padding:42px 28px;
  text-align:center;border:1px solid rgba(255,255,255,.35);
  border-radius:28px;background:rgba(255,255,255,.16);
  backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(80,0,40,.25);
  animation:cardIn 1s ease;
}
.badge{font-size:42px;animation:pulse 1.5s infinite}
h1{margin:12px 0 8px;color:white;font-size:clamp(30px,8vw,48px)}
.name{color:#fff4f8;text-shadow:0 3px 15px rgba(120,0,50,.35)}
.question{margin:22px 0 28px;color:white;font-size:clamp(19px,5vw,25px);line-height:1.5}
.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
button{
  border:0;border-radius:999px;padding:14px 30px;font-size:18px;font-weight:bold;
  cursor:pointer;transition:.25s;min-width:125px;
}
.yes{background:white;color:#e83e73;box-shadow:0 8px 25px rgba(0,0,0,.18)}
.no{background:rgba(255,255,255,.22);color:white;border:1px solid rgba(255,255,255,.5)}
button:hover{transform:translateY(-4px) scale(1.04)}
#answer{display:none;color:white;font-size:24px;font-weight:bold;margin-top:25px;line-height:1.5;animation:pop .7s ease}
.heart{
 position:fixed;bottom:-40px;font-size:22px;opacity:.75;z-index:1;
 animation:floatUp linear forwards;pointer-events:none
}
.flash{
 position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:5;
 animation:flash .5s forwards;pointer-events:none
}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.18)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
@keyframes flash{to{opacity:0}}
@media(max-width:480px){.card{padding:34px 20px}.buttons button{width:100%}}
</style>
</head>
<body>

<div class="card">
  <div class="badge">💕</div>
  <h1>Dear <span class="name">CHHING CHHING</span></h1>
  <p class="question">I have something important to ask you...<br><br>
  <strong>Will you be with me? ❤️</strong></p>

  <div class="buttons">
    <button class="yes" onclick="sayYes()">YES 💖</button>
    <button class="no" onclick="sayNo()">NO 🙈</button>
  </div>

  <div id="answer">
    YAY! 💕🥰<br>
    You just made my heart so happy! ❤️<br>
    <small>Thank you, CHHING CHHING. 💖</small>
  </div>
</div>

<script>
function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["❤️","💕","💗","💖","💘","💝"][Math.floor(Math.random()*6)];
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(16+Math.random()*24)+"px";
  h.style.animationDuration=(4+Math.random()*5)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
}
setInterval(createHeart,350);

function sayYes(){
  document.querySelector(".buttons").style.display="none";
  document.getElementById("answer").style.display="block";
  const flash=document.createElement("div");
  flash.className="flash";
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(),500);
  for(let i=0;i<35;i++) setTimeout(createHeart,i*35);
}

function sayNo(){
  const btn=document.querySelector(".no");
  btn.textContent="Are you sure? 🥺";
  btn.animate(
    [{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],
    {duration:400}
  );
}
</script>
</body>
</html>
